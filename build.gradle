plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "plants-and-zombies-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin {
    jvmToolchain(21)
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Glitchfiend'
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
}

// Dev-only GameTests (not packaged): src/gametest. Run with ./gradlew runGameTestServer
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    addModdingDependenciesTo(sourceSets.gametest)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // opens run/saves/smoke straight away (world prepared on the dev server for render smoke tests)
        clientSmoke {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'smoke', '--username', 'Dev', '--width', '1280', '--height', '720')
        }
        // joins the dev server on localhost (separate game dir so it can run next to runServer)
        clientMp {
            client()
            gameDirectory = project.file('run-client')
            programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565', '--username', 'Dev', '--width', '1280', '--height', '720')
        }
        server {
            server()
            programArgument '--nogui'
        }
        // headless load check: loads mods, registries and datapacks, generates a world, runs (zero) game tests, exits
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"

    // Iris: only its API is used (shader-pack checks), and only when the mod is present at runtime
    compileOnly "maven.modrinth:iris:${iris_version}"

    // Optional mods for dev runs: ./gradlew runClient -PwithIris  /  -PwithVanillaBackport
    if (project.hasProperty('withIris')) {
        runtimeOnly "maven.modrinth:sodium:${sodium_version}"
        runtimeOnly "maven.modrinth:iris:${iris_version}"
    }
    if (project.hasProperty('withVanillaBackport')) {
        runtimeOnly "maven.modrinth:vanillabackport:${vanillabackport_version}"
        runtimeOnly "maven.modrinth:platform:${platform_version}"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            neo_version_range        : neo_version_range,
            loader_version_range     : loader_version_range,
            kff_version_range        : kff_version_range,
            terrablender_version_range: terrablender_version_range,
            iris_version_range       : iris_version_range,
            vanillabackport_version_range: vanillabackport_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        freeCompilerArgs.add("-Xjvm-default=all")
    }
}

jar {
    from("LICENSE") { rename { "${it}_plants-and-zombies" } }
}

// Writes the main compile classpath to build/compile-classpath.txt (for checking Java sources with plain javac)
tasks.register('writeCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    outputs.file(out)
    doLast { out.get().asFile.text = sourceSets.main.compileClasspath.asPath }
}

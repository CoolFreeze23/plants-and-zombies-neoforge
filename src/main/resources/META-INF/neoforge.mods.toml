modLoader="kotlinforforge"
loaderVersion="${kff_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/joshxviii/plants-and-zombies/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/plantz/icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="plantz.mixins.json"

[[mixins]]
config="plantz.client.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="terrablender"
type="required"
versionRange="${terrablender_version_range}"
ordering="AFTER"
side="BOTH"
